<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151a22">
    <title>DealRoom - Pipeline Management</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        :root {
            color-scheme: dark;
            --bg-main: #0a0e14;
            --bg-panel: #151a22;
            --bg-card: #1c222b;
            --bg-hover: #262e39;
            --accent-orange: #ff8c42;
            --accent-blue: #0f2a3f;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2e3643;
            
            --stage-lead: #94a3b8;
            --stage-underwriting: #f59e0b;
            --stage-offer: #10b981;
            --stage-docs: #f97316;
            --stage-funded: #3b82f6;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        button {
            font-family: inherit;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 0 1.5rem 2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-orange);
        }

        .nav-link {
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid transparent;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--accent-blue);
            color: var(--text-main);
            border-left-color: var(--accent-orange);
        }

        /* Main Content Wrapper */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .top-header {
            height: 70px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            flex-shrink: 0;
        }

        .search-bar {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            width: 300px;
            font-family: var(--font-main);
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent-orange);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .date-display {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--accent-orange);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Area */
        .content-area {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }

        /* Controls / Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
        }

        .filter-select {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-family: var(--font-main);
        }

        .filter-select:focus-visible {
            border-color: var(--accent-orange);
        }

        .view-toggles {
            display: flex;
            background-color: var(--bg-panel);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .view-btn.active {
            background-color: var(--accent-blue);
            color: white;
        }

        #viewContainer {
            height: calc(100% - 60px);
        }

        /* Board View (Kanban) */
        .board-container {
            display: flex;
            gap: 1.5rem;
            height: 100%;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        .board-column {
            background-color: var(--bg-panel);
            border-radius: 8px;
            min-width: 300px;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .column-header {
            padding: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-count {
            background-color: var(--bg-card);
            color: var(--text-muted);
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .column-body {
            padding: 1rem;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .deal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .deal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            border-color: var(--accent-orange);
        }

        .deal-card:focus-visible {
            outline: 2px solid var(--accent-orange);
            outline-offset: -2px;
        }

        .deal-card-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
            overflow-wrap: anywhere;
        }

        .deal-card-client {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            overflow-wrap: anywhere;
        }

        .deal-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        .deal-amount {
            font-weight: 700;
            color: var(--accent-orange);
        }

        /* List View (Table) */
        .table-container {
            background-color: var(--bg-panel);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: auto;
            max-height: calc(100vh - 200px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: var(--bg-hover);
        }

        tbody tr:focus-visible {
            outline: 2px solid var(--accent-orange);
            outline-offset: -2px;
        }

        /* Map View */
        .map-container {
            width: 100%;
            height: calc(100vh - 220px);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            background-color: var(--bg-panel);
        }

        .leaflet-popup-content-wrapper {
            background-color: var(--bg-panel) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }
        
        .leaflet-popup-tip {
            background-color: var(--bg-panel) !important;
        }

        .leaflet-popup-content h4 {
            overflow-wrap: anywhere;
        }

        .map-popup-btn {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 0.5rem;
            width: 100%;
        }

        .map-popup-btn:hover {
            background-color: #e57d39;
        }

        /* Detail View */
        .detail-view {
            display: flex;
            gap: 2rem;
            min-height: 100%;
        }

        .detail-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
        }

        .detail-left {
            flex: 2;
        }

        .detail-right {
            flex: 1;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            margin: -0.5rem 0 1rem -0.5rem;
        }

        .btn-back:hover {
            color: var(--text-main);
        }

        .detail-header {
            margin-bottom: 2rem;
        }

        .detail-title {
            outline: none;          /* focus target, not interactive: no ring */
            font-weight: inherit;   /* keep the regular weight now that this is an h1 */
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            overflow-wrap: anywhere;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-group div {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #e57d39;
        }

        .load-error {
            margin: 2rem 2rem 0;
            border-color: var(--stage-docs);
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.85rem;
            top: 0.2rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-blue);
            border: 2px solid var(--bg-panel);
        }

        .timeline-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .timeline-content {
            font-size: 0.95rem;
        }

        /* Stage Badges */
        .stage-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Visually hidden but read by screen readers (persistent live region for result counts) */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Small screens: sidebar collapses into a top strip, panels stack */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                padding: 0.5rem 1rem;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .logo {
                font-size: 1.2rem;
                padding: 0 0.5rem 0 0;
                white-space: nowrap;
            }

            .sidebar nav {
                display: flex;
                overflow-x: auto;
                min-width: 0;
                -webkit-overflow-scrolling: touch;
            }

            .nav-link {
                padding: 0.6rem 0.75rem;
                font-size: 0.9rem;
                white-space: nowrap;
                border-left: none;
                border-bottom: 3px solid transparent;
            }

            .nav-link:hover, .nav-link.active {
                border-bottom-color: var(--accent-orange);
            }

            .top-header {
                height: auto;
                flex-wrap: wrap;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
            }

            .search-bar {
                width: 100%;
                order: 2;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
                order: 1;
            }

            .content-area {
                padding: 1rem;
            }

            .load-error {
                margin: 1rem 1rem 0;
            }

            .toolbar {
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-bottom: 1rem;
            }

            .filters {
                width: 100%;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .filter-select {
                flex: 1 1 140px;
                min-width: 0;
            }

            .view-toggles {
                width: 100%;
            }

            .view-btn {
                flex: 1;
                padding: 0.6rem 0.5rem;
            }

            #viewContainer {
                height: auto;
            }

            .board-container {
                height: auto;
                gap: 1rem;
            }

            .board-column {
                min-width: 260px;
                max-width: 260px;
            }

            .column-body {
                overflow-y: visible;
            }

            .deal-card-footer {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .stage-badge {
                white-space: nowrap;
            }

            .table-container {
                max-height: none;
            }

            th, td {
                padding: 0.75rem;
                white-space: nowrap;
            }

            .map-container {
                height: 60vh;
                min-height: 320px;
            }

            .detail-view {
                flex-direction: column;
                min-height: 0;
                gap: 1rem;
            }

            .detail-panel {
                padding: 1.25rem;
            }

            .detail-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 560px) {
            .sidebar {
                flex-wrap: wrap;
            }

            .sidebar nav {
                flex-wrap: wrap;
                overflow: visible;
            }

            .detail-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .date-display {
                font-size: 0.8rem;
            }

            /* Phone list view: keep Business | Amount | Stage on screen; Client, Industry,
               Next Action and Due Date are one tap away on the detail view */
            .table-container th:nth-child(2), .table-container td:nth-child(2),
            .table-container th:nth-child(3), .table-container td:nth-child(3),
            .table-container th:nth-child(6), .table-container td:nth-child(6),
            .table-container th:nth-child(7), .table-container td:nth-child(7) {
                display: none;
            }

            .table-container th, .table-container td {
                padding: 0.6rem 0.5rem;
                font-size: 0.9rem;
            }

            .table-container td:nth-child(1) {
                white-space: normal;
            }
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <span>◆</span> DealRoom
        </div>
        <nav>
            <a href="#" class="nav-link active" aria-current="page" onclick="event.preventDefault(); window.clearSelection();">Pipeline</a>
            <a href="#" class="nav-link" onclick="event.preventDefault()">Today</a>
            <a href="#" class="nav-link" onclick="event.preventDefault()">Draft Review</a>
            <a href="#" class="nav-link" onclick="event.preventDefault()">Advisor Team</a>
            <a href="#" class="nav-link" onclick="event.preventDefault()">Insights</a>
            <a href="#" class="nav-link" onclick="event.preventDefault()">Connections</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="top-header">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search business or merchant name..." aria-label="Search business or merchant name" oninput="window.handleSearch(event)">
            <div class="header-right">
                <div class="date-display" id="dateDisplay"></div>
                <div class="avatar">DR</div>
            </div>
            <div id="resultsStatus" class="sr-only" role="status"></div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="content-area" id="mainContent">
            <!-- Rendered dynamically by JavaScript -->
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        // --- 1. DATA & STATE ---
        const initialData = [
            { id: "M-101", merchantName: "John Smith", businessName: "Apex Retail", industry: "Retail", amountRequested: 50000, stage: "Underwriting", nextAction: "Follow up on bank statements", dueDate: "2024-06-15", lat: 40.7128, lng: -74.0060, lastContact: "2024-06-01" },
            { id: "M-102", merchantName: "Maria Garcia", businessName: "Sunset Cafe", industry: "Restaurant", amountRequested: 120000, stage: "Offer Accepted", nextAction: "Send contract for signature", dueDate: "2024-06-10", lat: 34.0522, lng: -118.2437, lastContact: "2024-06-02" },
            { id: "M-103", merchantName: "David Chen", businessName: "Midwest Logistics", industry: "Transportation", amountRequested: 250000, stage: "Lead", nextAction: "Initial discovery call", dueDate: "2024-06-20", lat: 41.8781, lng: -87.6298, lastContact: "2024-05-28" },
            { id: "M-104", merchantName: "Sarah Johnson", businessName: "Johnson's Bakery", industry: "Restaurant", amountRequested: 75000, stage: "Missing Docs", nextAction: "Request voided check", dueDate: "2024-06-12", lat: 29.7604, lng: -95.3698, lastContact: "2024-06-03" },
            { id: "M-105", merchantName: "Mike Brown", businessName: "Brown's Auto", industry: "Automotive", amountRequested: 150000, stage: "Funded", nextAction: "N/A", dueDate: "2024-05-30", lat: 33.7490, lng: -84.3880, lastContact: "2024-05-30" }
        ];

        let state = {
            deals: [],
            view: 'board', // 'board', 'list', 'map'
            selected: null, // deal ID
            search: '',
            industry: 'All',
            stage: 'All'
        };

        const stages = ["Lead", "Underwriting", "Offer Accepted", "Missing Docs", "Funded"];
        const stageColors = {
            "Lead": "#94a3b8",
            "Underwriting": "#f59e0b",
            "Offer Accepted": "#10b981",
            "Missing Docs": "#f97316",
            "Funded": "#3b82f6"
        };

        let mapInstance = null;
        let mapInitTimer = null;
        let markerLayer = null; // cluster group living on mapInstance
        let mapZooming = false; // true between Leaflet zoomstart and zoomend

        // --- 2. UTILITY FUNCTIONS ---
        const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
        const formatCurrency = (amount) => {
            // Sheet cells may arrive as text ("50,000", "$50,000", "N/A") or be missing; never render "$NaN".
            const n = typeof amount === 'number' ? amount : Number(String(amount ?? '').replace(/[$,\s]/g, '') || NaN);
            return Number.isFinite(n) ? usd.format(n) : '—';
        };

        // Escape a value for safe insertion into HTML text or attribute positions
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Compare ids the way the HTML parser stores them: CR and CRLF inside an attribute value become LF
        const norm = (v) => String(v ?? '').replace(/\r\n?/g, '\n');

        const stageColor = (stage) => Object.prototype.hasOwnProperty.call(stageColors, stage) ? stageColors[stage] : "#94a3b8";

        const getStageBadge = (stage) => {
            const color = stageColor(stage);
            return `<span class="stage-badge" style="background-color: ${color}">${esc(stage)}</span>`;
        };

        const getIndustries = () => {
            const ind = new Set(state.deals.map(d => String(d.industry ?? '').trim()).filter(Boolean));
            return ["All", ...Array.from(ind)];
        };

        const getFilteredDeals = () => {
            const s = v => String(v ?? '').toLowerCase();
            const searchLower = s(state.search).trim();
            return state.deals.filter(deal => {
                const matchesSearch = s(deal.businessName).includes(searchLower) ||
                                      s(deal.merchantName).includes(searchLower);
                const matchesIndustry = state.industry === 'All' || String(deal.industry ?? '').trim() === state.industry;
                const matchesStage = state.stage === 'All' || deal.stage === state.stage;
                return matchesSearch && matchesIndustry && matchesStage;
            });
        };

        // --- 3. EVENT HANDLERS (Bound to Window) ---
        // Filter/search changes: when a map is live, only swap its markers so zoom, center and tiles survive
        const applyFilters = () => {
            if (mapInstance && state.view === 'map') {
                refreshMarkers();
            } else {
                render();
            }
            announceResults();
        };
        // Tell screen-reader users what a filter/search change did; the region lives in the header so it survives re-renders
        const announceResults = () => {
            const el = document.getElementById('resultsStatus');
            if (!el) return;
            const n = getFilteredDeals().length;
            el.textContent = n === 0 ? 'No deals match your search or filters.' : `Showing ${n} of ${state.deals.length} deals.`;
        };
        window.handleSearch = (e) => { state.search = e.target.value; state.selected = null; applyFilters(); };
        window.handleIndustryFilter = (e) => { state.industry = e.target.value; applyFilters(); };
        window.handleStageFilter = (e) => { state.stage = e.target.value; applyFilters(); };
        window.setView = (view) => { state.view = view; render(); };
        window.selectDeal = (id) => { state.selected = id; render(); };
        window.clearSelection = () => {
            if (!state.selected) return;
            const last = String(state.selected);
            state.selected = null;
            render();
            // Return focus to the card/row that opened the file, or to the active view button
            const origin = document.querySelector(`#mainContent [data-id="${CSS.escape(last)}"]`) || document.getElementById('viewBtn-' + state.view);
            if (origin) origin.focus();
        };
        window.triggerAlert = () => { alert("Follow-up preparation sequence initiated."); };

        // --- 4. CORE RENDER FUNCTION ---
        const render = () => {
            const mainContent = document.getElementById('mainContent');
            
            // Clean up Leaflet map instance safely if switching views
            if (mapInitTimer) {
                clearTimeout(mapInitTimer);
                mapInitTimer = null;
            }
            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
                markerLayer = null;
            }

            // Detail View Mode
            if (state.selected) {
                const deal = state.deals.find(d => norm(d.id) === norm(state.selected));
                if (deal) {
                    mainContent.innerHTML = renderDetailView(deal);
                    // Move focus to the new view so keyboard and screen-reader users are not dropped on <body>
                    const title = mainContent.querySelector('.detail-title');
                    if (title) title.focus();
                    return; // Exit render function early
                }
                state.selected = null; // Unknown ID: fall back to the dashboard
            }
            
            // Dashboard Mode (Board/List/Map)
            // Remember which toolbar control had focus so a keyboard user keeps their place across the rebuild
            const focusedId = document.activeElement && mainContent.contains(document.activeElement) ? document.activeElement.id : null;
            mainContent.innerHTML = `
                <div class="toolbar">
                    <div class="filters">
                        <select id="industryFilter" class="filter-select" aria-label="Filter by industry" onchange="window.handleIndustryFilter(event)">
                            ${getIndustries().map(ind => `<option value="${esc(ind)}" ${state.industry === ind ? 'selected' : ''}>Industry: ${esc(ind)}</option>`).join('')}
                        </select>
                        <select id="stageFilter" class="filter-select" aria-label="Filter by stage" onchange="window.handleStageFilter(event)">
                            <option value="All" ${state.stage === 'All' ? 'selected' : ''}>Stage: All</option>
                            ${stages.map(s => `<option value="${s}" ${state.stage === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <div class="view-toggles">
                        <button id="viewBtn-board" class="view-btn ${state.view === 'board' ? 'active' : ''}" aria-pressed="${state.view === 'board'}" onclick="window.setView('board')">Board</button>
                        <button id="viewBtn-list" class="view-btn ${state.view === 'list' ? 'active' : ''}" aria-pressed="${state.view === 'list'}" onclick="window.setView('list')">List</button>
                        <button id="viewBtn-map" class="view-btn ${state.view === 'map' ? 'active' : ''}" aria-pressed="${state.view === 'map'}" onclick="window.setView('map')">Map</button>
                    </div>
                </div>
                <div id="viewContainer"></div>
            `;

            const viewContainer = document.getElementById('viewContainer');
            if (focusedId) {
                const again = document.getElementById(focusedId);
                if (again) again.focus({ preventScroll: true });
            }
            
            if (state.view === 'board') {
                viewContainer.innerHTML = renderBoardView();
            } else if (state.view === 'list') {
                viewContainer.innerHTML = renderListView();
            } else if (state.view === 'map') {
                viewContainer.innerHTML = `<p id="mapEmptyNote" ${getFilteredDeals().length ? 'hidden' : ''} style="color: var(--text-muted); margin-bottom: 1rem;">No deals match your search or filters.</p><div id="map" class="map-container"></div>`;
                // Initialize map after DOM paints
                mapInitTimer = setTimeout(initMap, 100);
            }
        };

        // --- 5. COMPONENT RENDERERS ---
        const renderBoardView = () => {
            const filtered = getFilteredDeals();
            let html = `<div class="board-container">`;
            
            stages.forEach(stage => {
                const stageDeals = filtered.filter(d => d.stage === stage);
                html += `
                    <div class="board-column">
                        <div class="column-header">
                            <span>${stage}</span>
                            <span class="badge-count">${stageDeals.length}</span>
                        </div>
                        <div class="column-body">
                            ${stageDeals.map(deal => `
                                <div class="deal-card" role="button" tabindex="0" data-id="${esc(deal.id)}">
                                    <div class="deal-card-title">${esc(deal.businessName)}</div>
                                    <div class="deal-card-client">${esc(deal.merchantName)} • ${esc(deal.industry)}</div>
                                    <div class="deal-card-footer">
                                        <div class="deal-amount">${formatCurrency(deal.amountRequested)}</div>${getStageBadge(deal.stage)}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        };

        const renderListView = () => {
            const filtered = getFilteredDeals();
            let html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Business</th>
                                <th>Client</th>
                                <th>Industry</th>
                                <th>Amount</th>
                                <th>Stage</th>
                                <th>Next Action</th>
                                <th>Due Date</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            filtered.forEach(deal => {
                html += `
                    <tr tabindex="0" data-id="${esc(deal.id)}">
                        <td style="font-weight: 500;">${esc(deal.businessName)}</td>
                        <td>${esc(deal.merchantName)}</td>
                        <td>${esc(deal.industry)}</td>
                        <td style="font-weight: 600; color: var(--accent-orange);">${formatCurrency(deal.amountRequested)}</td>
                        <td>${getStageBadge(deal.stage)}</td>
                        <td>${esc(deal.nextAction)}</td>
                        <td>${esc(deal.dueDate)}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            if (filtered.length === 0) {
                html += `<div style="padding: 1.5rem; text-align: center; color: var(--text-muted);">No deals match your search or filters.</div>`;
            }
            html += `</div>`;
            return html;
        };

        const renderDetailView = (deal) => {
            return `
                <div class="detail-view">
                    <div class="detail-panel detail-left">
                        <button class="btn-back" onclick="window.clearSelection()">← Back to Pipeline</button>
                        
                        <div class="detail-header">
                            <h1 class="detail-title" tabindex="-1">${esc(deal.businessName)}</h1>
                            <div style="color: var(--text-muted); margin-bottom: 1rem;">Client: ${esc(deal.merchantName)}</div>
                            ${getStageBadge(deal.stage)}
                        </div>

                        <div class="detail-grid">
                            <div class="info-group">
                                <label>Industry</label>
                                <div>${esc(deal.industry)}</div>
                            </div>
                            <div class="info-group">
                                <label>Requested Amount</label>
                                <div style="color: var(--accent-orange); font-size: 1.5rem; font-weight: 700;">${formatCurrency(deal.amountRequested)}</div>
                            </div>
                            <div class="info-group">
                                <label>Next Action</label>
                                <div>${esc(deal.nextAction)}</div>
                            </div>
                            <div class="info-group">
                                <label>Due Date</label>
                                <div>${esc(deal.dueDate)}</div>
                            </div>
                            <div class="info-group">
                                <label>Last Contact</label>
                                <div>${esc(deal.lastContact)}</div>
                            </div>
                            <div class="info-group">
                                <label>System ID</label>
                                <div>${esc(deal.id)}</div>
                            </div>
                        </div>

                        <button class="btn-primary" onclick="window.triggerAlert()">Prepare Follow-up</button>
                    </div>

                    <div class="detail-panel detail-right">
                        <h3 style="margin-bottom: 1.5rem;">Activity Timeline</h3>
                        <div class="timeline">
                            <div class="timeline-item">
                                <div class="timeline-date">Today</div>
                                <div class="timeline-content">Viewed application details in DealRoom</div>
                            </div>
                            <div class="timeline-item">
                                <div class="timeline-date">${esc(deal.lastContact)}</div>
                                <div class="timeline-content">Last recorded communication with ${esc(deal.merchantName)}</div>
                            </div>
                            <div class="timeline-item">
                                <div class="timeline-date">2024-05-15</div>
                                <div class="timeline-content">Initial inquiry submitted for ${formatCurrency(deal.amountRequested)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const initMap = () => {
            // Guard clause if Leaflet fails to load, DOM element is missing, or a map already exists
            mapInitTimer = null;
            if (mapInstance || typeof L === 'undefined' || !document.getElementById('map')) return;

            mapInstance = L.map('map').setView([39.8283, -98.5795], 4);
            mapZooming = false;
            mapInstance.on('zoomstart', () => { mapZooming = true; }).on('zoomend', () => { mapZooming = false; });
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(mapInstance);

            // Leaflet only handles Escape while the map container itself is focused; cover markers and the popup too
            mapInstance.getContainer().addEventListener('keydown', (e) => { if (e.key === 'Escape') mapInstance.closePopup(); });

            refreshMarkers();
        };

        // Rebuild the marker layer from the current filters without touching the map itself
        const refreshMarkers = () => {
            if (!mapInstance) return;
            if (!markerLayer) {
                // Degrade to a plain feature group if Leaflet.markercluster failed to load
                markerLayer = (typeof L.markerClusterGroup === 'function')
                    ? L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true })
                    : L.featureGroup();
                mapInstance.addLayer(markerLayer);
            }
            markerLayer.clearLayers();

            const filtered = getFilteredDeals();
            const note = document.getElementById('mapEmptyNote');
            if (note) note.hidden = filtered.length > 0;
            const markers = [];

            filtered.forEach(deal => {
                // Skip deals without usable coordinates (blank/missing sheet cells) instead of throwing
                const lat = parseFloat(deal.lat), lng = parseFloat(deal.lng);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

                const color = stageColor(deal.stage);
                
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${color}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });

                const marker = L.marker([lat, lng], { icon: customIcon, title: String(deal.businessName ?? '').trim() || String(deal.id ?? '').trim() || 'Deal' });
                
                const popupContent = `
                    <div style="min-width: 150px; padding: 5px;">
                        <h4 style="margin: 0 0 5px 0; color: #fff;">${esc(deal.businessName)}</h4>
                        <p style="margin: 0 0 5px 0; font-weight: bold; color: var(--accent-orange);">${formatCurrency(deal.amountRequested)}</p>
                        <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #aaa;">${esc(deal.stage)}</p>
                        <button class="map-popup-btn" data-id="${esc(deal.id)}">Open File</button>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers.push(marker);
            });

            markers.forEach(m => markerLayer.addLayer(m));

            // Keep the user's position, but if the new results are all off-screen bring them into view.
            // A setView issued while Leaflet is mid zoom-animation is dropped or reverted, so when a zoom is
            // running re-run this check (against whatever the layer holds by then) once it has finished.
            const fitOffscreen = () => {
                const shown = markerLayer.getLayers();
                if (shown.length && !shown.some(m => mapInstance.getBounds().contains(m.getLatLng()))) {
                    mapInstance.fitBounds(markerLayer.getBounds(), { padding: [40, 40], maxZoom: mapInstance.getZoom(), animate: false });
                }
            };
            if (mapZooming) mapInstance.once('zoomend', fitOffscreen); else fitOffscreen();
        };

        // --- 6. APP INITIALIZATION & FETCH ---
        const fetchDeals = async () => {
            /*
            // READY FOR GOOGLE SHEETS API INTEGRATION
            //
            // WARNING - READ BEFORE ENABLING THIS BLOCK:
            // This file is served from a PUBLIC GitHub Pages site (public repo).
            // Anything committed here, including the Apps Script URL below, is
            // world-readable. For an unauthenticated fetch() from a static page
            // to succeed, the Apps Script web app must be deployed with access
            // "Anyone", which lets anyone who opens this page (or the URL)
            // download every row of the sheet. Do NOT point this at a sheet with
            // real merchant data while the page is hosted publicly. Keep the
            // public copy on the mock data below, or host the live version
            // behind authentication (private repo + access-controlled host).
            //
            // Replace YOUR_GOOGLE_APPS_SCRIPT_URL, then delete the two mock-data lines below.
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '<p role="status" style="color: var(--text-muted);">Loading deals…</p>';
            try {
                const response = await fetch('YOUR_GOOGLE_APPS_SCRIPT_URL');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Expected a JSON array of deals');
                state.deals = data.filter(row => row && typeof row === 'object');
            } catch (error) {
                console.error("Error fetching deals:", error);
                state.deals = [];
                mainContent.insertAdjacentHTML('beforebegin',
                    '<div class="detail-panel load-error" role="alert">Could not load deals from Google Sheets. Check the script URL and its deployment access (details in the browser console).</div>');
            }
            try {
                render();
            } catch (error) {
                console.error("Error rendering deals:", error);
                state.deals = [];
                mainContent.insertAdjacentHTML('beforebegin',
                    '<div class="detail-panel load-error" role="alert">Could not display the loaded deals (details in the browser console).</div>');
                render();
            }
            */
            
            // Using mock data for current implementation
            state.deals = initialData;
            render();
        };

        const init = () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', options);

            // Pick up a search value the browser restored into the input on reload
            state.search = document.getElementById('searchInput').value || '';

            // Deal ids live in a data attribute; one delegated listener opens the file
            // (the listener sits on the persistent container so it survives every re-render)
            const mainContent = document.getElementById('mainContent');
            mainContent.addEventListener('click', (e) => {
                const el = e.target.closest('[data-id]');
                if (el) window.selectDeal(el.dataset.id);
            });

            // Keyboard activation for cards and rows (Enter or Space behaves like click)
            mainContent.addEventListener('keydown', (e) => {
                if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.deal-card, tbody tr')) {
                    e.preventDefault();
                    e.target.click();
                }
                // Leaflet opens a marker popup on Enter only; let Space activate a focused marker as well
                if (e.key === ' ' && e.target.matches('.leaflet-marker-icon')) {
                    e.preventDefault();
                    e.target.click();
                }
            });

            // Kickoff data load and render
            fetchDeals();
        };

        // Run when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
