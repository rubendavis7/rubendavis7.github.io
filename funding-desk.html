<title>Ruben's Funding Desk — Delta Capital</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ---------- Brand tokens (Delta Capital Group) ---------- */
:root{
  color-scheme:light;
  --link:#1E3C6E;
  --navy:#0F2148;          /* chrome / headings */
  --navy-2:#1E3C6E;        /* icon circles, chips */
  --orange:#E8611F;        /* primary action only */
  --orange-soft:#FBE9DE;
  --ground:#F3F5FB;        /* page */
  --card:#FFFFFF;
  --panel:#E9EDF8;         /* lavender section cards, like the site */
  --ink:#13203B;
  --muted:#5B6270;
  --line:#D9DFEE;
  --chrome-ink:#FFFFFF;
  --chrome-muted:#AAB6D3;
  /* stage ramp — deliberately no orange, so "action" never reads as "stage" */
  --st-cold:#64748B; --st-warm:#0E8F76; --st-app:#2563EB; --st-appr:#7C3AED;
  --st-con:#0891B2; --st-fund:#15803D; --st-dec:#9F1239;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --shadow:0 10px 30px rgba(15,33,72,.10);
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --link:#9FB4E8;
    --ground:#0B1120; --card:#141C30; --panel:#182240;
    --ink:#E8ECF6; --muted:#9AA4BC; --line:#2A3554;
    --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
    --orange-soft:#3A2415; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --link:#9FB4E8;
  --ground:#0B1120; --card:#141C30; --panel:#182240;
  --ink:#E8ECF6; --muted:#9AA4BC; --line:#2A3554;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --orange-soft:#3A2415; --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.money,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--link)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- Chrome ---------- */
header{
  background:var(--navy);color:var(--chrome-ink);
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo .word{font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo .word span{font-weight:400}
.logo .sub{font-size:11.5px;color:var(--chrome-muted);letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border-radius:999px;padding:10px 18px;font-weight:700;white-space:nowrap;
  transition:transform .08s ease, box-shadow .08s ease}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
.btn:active{transform:scale(.97)}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(232,97,31,.35)}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.btn-chrome{border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-danger{color:var(--bad);border:1.5px solid var(--line);background:var(--card)}

.stats{display:flex;gap:10px;padding:12px 18px 0;flex-wrap:wrap}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:10px 16px;min-width:130px;flex:1;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:21px;font-weight:800;margin-top:2px}
.stat .v.money{letter-spacing:-.02em}
.stat.due .v{color:var(--bad)}

nav.tabs{display:flex;gap:8px;padding:14px 18px 4px;flex-wrap:wrap}
.tab{
  border-radius:999px;padding:9px 20px;font-weight:700;color:var(--navy-2);
  border:1.5px solid var(--navy-2);background:transparent}
:root[data-theme="dark"] .tab{color:#B9C6EA;border-color:#3D4E7E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab{color:#B9C6EA;border-color:#3D4E7E}}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
main{padding:14px 18px 90px;max-width:1400px;margin:0 auto}

/* ---------- Board ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:280px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}
.col{flex:0 0 272px;background:var(--panel);border-radius:var(--r);padding:10px}
.col h3{
  margin:2px 4px 10px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.col h3 .dot{width:10px;height:10px;border-radius:50%;flex:none}
.col h3 .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.col h3 .sum{font-size:11px;color:var(--muted);font-weight:600}
.col.dragover{outline:2.5px dashed var(--orange);outline-offset:-3px}
.cards{display:flex;flex-direction:column;gap:8px;min-height:30px}
.cardl{
  background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);
  border-left:4px solid var(--muted);cursor:grab}
.cardl:active{cursor:grabbing}
.cardl .biz{font-weight:800;font-size:14.5px}
.cardl .who{color:var(--muted);font-size:12.5px;margin-top:1px}
.cardl .amts{display:flex;gap:10px;margin-top:7px;font-size:12.5px}
.cardl .amts b{font-size:13.5px}
.cardl .amts .lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cardl .foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.overdue{background:#FBE3E3;color:var(--bad)}
.chip.today{background:#FDEFD9;color:var(--warn)}
.chip.later{background:var(--panel);color:var(--muted)}
:root[data-theme="dark"] .chip.overdue{background:#3A1717}
:root[data-theme="dark"] .chip.today{background:#3A2A12}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .chip.overdue{background:#3A1717}
  :root:not([data-theme="light"]) .chip.today{background:#3A2A12}
}
.iconb{
  width:30px;height:30px;border-radius:50%;background:var(--navy-2);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;text-decoration:none}
.cardl .foot .iconb{margin-left:auto}
.cardl .foot .iconb + .iconb{margin-left:0}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 6px}

/* ---------- Today ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:var(--r);padding:18px}
.panel>h2{margin:0 0 4px;font-size:19px;color:var(--navy);letter-spacing:-.01em}
:root[data-theme="dark"] .panel>h2{color:#DCE4F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel>h2{color:#DCE4F8}}
.panel>.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.block{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.block .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--navy-2);white-space:nowrap;padding-top:2px;min-width:86px}
:root[data-theme="dark"] .block .t{color:#9FB4E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .block .t{color:#9FB4E8}}
.block .w{font-weight:800;font-size:14px}
.block .d{color:var(--muted);font-size:12.5px;margin-top:1px}
.qrow{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);flex-wrap:wrap}
.qrow .info{flex:1;min-width:150px;cursor:pointer}
.qrow .biz{font-weight:800;font-size:14px}
.qrow .meta{font-size:12px;color:var(--muted)}
.stagechip{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* ---------- Templates ---------- */
.pickbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pickbar select{max-width:340px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.tgrid{grid-template-columns:1fr}}
.tpl{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.tpl .name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tpl .name .use{font-size:11px;font-weight:700;color:var(--muted)}
.tpl .subj{font-size:13px;margin-top:6px}
.tpl .subj b{color:var(--navy-2)}
:root[data-theme="dark"] .tpl .subj b{color:#9FB4E8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tpl .subj b{color:#9FB4E8}}
.tpl pre{
  white-space:pre-wrap;background:var(--panel);border-radius:12px;padding:12px;
  font:13px/1.55 Georgia,"Times New Roman",serif;margin:9px 0 10px;color:var(--ink)}
.tpl .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Playbook ---------- */
.pb{max-width:860px}
.pb .panel{margin-bottom:14px}
.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.numbers .nb{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.numbers .nb .v{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
:root[data-theme="dark"] .numbers .nb .v{color:#DCE4F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .numbers .nb .v{color:#DCE4F8}}
.numbers .nb .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.script{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-top:10px}
.script p{margin:8px 0}
.script .say{font-family:Georgia,serif;font-size:15px}
.script .cue{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.check{display:flex;gap:9px;align-items:flex-start;margin:7px 0}
.check .ck{width:19px;height:19px;border-radius:50%;background:var(--orange);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:none;margin-top:2px}
table.cad{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
table.cad th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line)}
table.cad td{padding:8px;border-bottom:1px solid var(--line)}
.notebox{border-left:4px solid var(--warn);background:var(--card);border-radius:0 14px 14px 0;padding:11px 14px;margin-top:12px;font-size:13.5px;box-shadow:var(--shadow)}

/* ---------- Drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,33,72,.45);display:none;z-index:40}
.scrim.open{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);
  z-index:50;box-shadow:-18px 0 50px rgba(15,33,72,.25);transform:translateX(105%);
  transition:transform .22s ease;display:flex;flex-direction:column}
.drawer:not(.open){visibility:hidden;transition:transform .22s ease, visibility 0s .22s}
@media (prefers-reduced-motion: reduce){.drawer,.drawer:not(.open){transition:none}}
.drawer.open{transform:none}
.drawer .dh{background:var(--navy);color:#fff;padding:16px 18px}
.drawer .dh .biz{font-size:19px;font-weight:800;letter-spacing:-.01em}
.drawer .dh .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.drawer .dh select{width:auto;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.drawer .dh select option{color:var(--ink);background:var(--card)}
.drawer .body{flex:1;overflow-y:auto;padding:16px 18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:14px}
.fgrid .f .lv{font-size:14px;font-weight:600;margin-top:2px;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.notes h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--panel);border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:13.5px}
.note .ts{font-size:11px;color:var(--muted);font-weight:700}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.addnote{display:flex;gap:8px;margin-bottom:12px}

.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .mcard{background:var(--card);border-radius:var(--r);width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 14px;color:var(--navy);font-size:20px}
:root[data-theme="dark"] .modal h2{color:#DCE4F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modal h2{color:#DCE4F8}}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mgrid .full{grid-column:1/-1}
@media(max-width:520px){.mgrid{grid-template-columns:1fr}}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;box-shadow:var(--shadow);
  max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<header>
  <div class="logo">
    <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true">
      <path d="M17 2 L27 15 H22.5 L17 8 L11.5 15 H7 Z" fill="#E8611F"/>

<nav class="tabs" role="tablist" id="tabs">

<main id="main"></main>

<div class="scrim" id="scrim"></div>

<script>
'use strict';
/* ================= data ================= */
const STAGES=[
 {id:'cold', label:'Cold', color:'var(--st-cold)', fu:3},
 {id:'warm', label:'Warm', color:'var(--st-warm)', fu:1},
 {id:'app',  label:'Application', color:'var(--st-app)', fu:1},
 {id:'appr', label:'Approved', color:'var(--st-appr)', fu:1},
 {id:'con',  label:'Contracts', color:'var(--st-con)', fu:1},
 {id:'fund', label:'Funded', color:'var(--st-fund)', fu:30},
 {id:'dec',  label:'Declined', color:'var(--st-dec)', fu:45},
];
const stageById=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const PIPE_STAGES=['warm','app','appr','con'];
const KEY='rubenDesk_v1';

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const uid=()=>'L'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
function normDate(v){
  v=String(v==null?'':v).trim();if(!v)return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  const m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);   /* US M/D/YYYY */
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');}
  const d=new Date(v);
  if(!isNaN(d.getTime()))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return '';
}
const fmt$=n=>{n=Number(n)||0;return '$'+n.toLocaleString('en-US');};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=p=>String(p||'').replace(/[^\d+]/g,'');

let state=load();
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}
  return {leads:seed(),settings:{rep:'Ruben Davis',myphone:'(305) 735-3097',link:'https://deltacapitalgroup.com/ruben/'},view:'board',personalizeId:''};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function seed(){
  const t=todayStr();
  return [

function mergeFields(text,lead){
  const s=state.settings;
  const map={
    first:lead?(lead.first||lead.biz):'[First name]',
    owner:lead?((lead.first||'')+' '+(lead.last||'')).trim()||'[Owner]':'[Owner]',
    biz:lead?lead.biz:'[Business name]',
    amount:lead&&lead.requested?fmt$(lead.requested):'[Amount]',
    revenue:lead&&lead.revenue?fmt$(lead.revenue):'[Monthly revenue]',
    link:s.link,rep:s.rep,myphone:s.myphone||'(my direct line)',
  };
  return text.replace(/\{\{(\w+)\}\}/g,(m,k)=>map[k]!==undefined?map[k]:m);
}

function counts(){
  const t=todayStr();
  const active=state.leads.filter(l=>l.stage!=='fund'&&l.stage!=='dec');
  const pipe=state.leads.filter(l=>PIPE_STAGES.includes(l.stage)).reduce((a,l)=>a+(Number(l.requested)||0),0);
  const funded=state.leads.filter(l=>l.stage==='fund').reduce((a,l)=>a+(Number(l.requested)||0),0);
  const due=state.leads.filter(l=>l.nextFu&&l.nextFu<=t&&l.stage!=='fund').length;
  return {active:active.length,pipe,funded,due};
}
function renderStats(){
  const c=counts();

}

function fuChip(l){
  if(!l.nextFu)return '<span class="chip later">no date</span>';
  const t=todayStr();
  if(l.nextFu<t)return '<span class="chip overdue">overdue '+esc(l.nextFu.slice(5))+'</span>';
  if(l.nextFu===t)return '<span class="chip today">due today</span>';
  return '<span class="chip later">'+esc(l.nextFu.slice(5))+'</span>';
}

function render(){
  renderStats();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===state.view)));
  if(state.view==='board')renderBoard();
  else if(state.view==='today')renderToday();
  else if(state.view==='templates')renderTemplates();
  else renderPlaybook();
  save();
}

function moveStage(id,stage){
  const l=state.leads.find(x=>x.id===id);if(!l||l.stage===stage)return;
  const from=stageById(l.stage).label,to=stageById(stage);
  l.stage=stage;
  l.notes.unshift({ts:todayStr(),text:'Moved '+from+' → '+to.label});
  if(!l.nextFu||l.nextFu<todayStr())l.nextFu=addDays(to.fu);
  toast(esc(l.biz)+' → '+to.label);
  render();
  if(drawerId===id)openDrawer(id);
}

       <span class="spacer"></span>
       <button class="btn btn-chrome btn-sm" id="dClose">✕</button>
     </div>
   </div>

       <div class="f"><label>Email</label><div class="lv">${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:'—'}</div></div>
       <div class="f"><label>Wants</label><div class="lv money">${fmt$(l.requested)}</div></div>

       <div class="f"><label>Source</label><div class="lv">${esc(l.source)||'—'}</div></div>

     <button class="btn btn-ghost btn-sm" id="dEdit">Edit</button>

  $('#drawer').inert=false;

  $('#dTouch').onclick=()=>logTouch(id);

  $('#dNote').addEventListener('keydown',e=>{if(e.key==='Enter')$('#dAddNote').click();});

let editingId=null;
function openLeadModal(lead){
  editingId=lead?lead.id:null;
  $('#modalTitle').textContent=lead?'Edit Lead':'New Lead';
  $('#stageSelect').innerHTML=STAGES.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
  const f=$('#leadForm');
  f.reset();
  if(lead){
    for(const k of ['biz','first','last','phone','email','revenue','requested','industry','source','stage','nextFu'])

  }else{
    f.elements.stage.value='cold';f.elements.nextFu.value=todayStr();
  }
  $('#leadModal').classList.add('open');
  f.elements.biz.focus();
}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));}

  e.preventDefault();
  const f=e.target,g=k=>f.elements[k].value.trim();
  const data={biz:g('biz'),first:g('first'),last:g('last'),phone:g('phone'),email:g('email'),

    industry:g('industry'),source:g('source'),stage:f.elements.stage.value,nextFu:f.elements.nextFu.value};

/* ================= csv ================= */
const CSV_HEADERS=['business','owner_first','owner_last','phone','email','revenue','requested','industry','source','stage','created','last_touch','next_followup','notes'];
function exportCsv(){
  const rows=[CSV_HEADERS.join(',')];
  for(const l of state.leads){
    const vals=[l.biz,l.first,l.last,l.phone,l.email,l.revenue,l.requested,l.industry,l.source,
      stageById(l.stage).label,l.created,l.lastTouch,l.nextFu,(l.notes||[]).map(n=>n.ts+': '+n.text).join(' | ')];
    rows.push(vals.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));
  }
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='funding-desk-'+todayStr()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV downloaded — import to Google Sheets');
}
$('#csvFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const rows=parseCsv(String(reader.result));
      if(rows.length<2){toast('No rows found');return;}
      const hdr=rows[0].map(h=>h.toLowerCase().trim());
      const col=name=>hdr.findIndex(h=>h.includes(name));
      const ci={biz:col('business'),first:col('first'),last:col('owner_last')>=0?col('owner_last'):col('last'),
        phone:col('phone'),email:col('email'),
        revenue:col('revenue'),requested:Math.max(col('requested'),col('amount')),industry:col('industry'),
        source:col('source'),stage:col('stage'),nextFu:col('follow'),
        created:col('created'),lastTouch:col('touch'),notes:col('note')};
      if(ci.biz<0){toast('Need a "business" column');return;}
      const cell=(r,i)=>String(i>=0&&r[i]!=null?r[i]:'').trim();
      const leadKey=(biz,phone)=>biz.toLowerCase().replace(/\s+/g,' ')+'|'+digits(phone);
      const seen=new Set(state.leads.map(l=>leadKey(String(l.biz||''),l.phone)));
      let n=0,skipped=0;
      for(let i=1;i<rows.length;i++){
        const r=rows[i];const biz=cell(r,ci.biz);if(!biz)continue;
        const key=leadKey(biz,cell(r,ci.phone));
        if(seen.has(key)){skipped++;continue;}
        seen.add(key);
        const stRaw=cell(r,ci.stage).toLowerCase();
        const st=STAGES.find(s=>stRaw.includes(s.label.toLowerCase())||stRaw===s.id);
        const notesRaw=cell(r,ci.notes);
        const notes=notesRaw
          ?notesRaw.split(' | ').map(seg=>{const p=seg.indexOf(': ');
             return p>0?{ts:seg.slice(0,p),text:seg.slice(p+2)}:{ts:todayStr(),text:seg};})
          :[{ts:todayStr(),text:'Imported from CSV'}];
        state.leads.push({id:uid(),biz,first:cell(r,ci.first),last:cell(r,ci.last),
          phone:cell(r,ci.phone),email:cell(r,ci.email),
          revenue:Number(cell(r,ci.revenue).replace(/[^\d.]/g,''))||0,
          requested:Number(cell(r,ci.requested).replace(/[^\d.]/g,''))||0,
          industry:cell(r,ci.industry),source:cell(r,ci.source)||'Import',
          stage:st?st.id:'cold',
          created:normDate(cell(r,ci.created))||todayStr(),
          lastTouch:normDate(cell(r,ci.lastTouch))||'',
          nextFu:normDate(cell(r,ci.nextFu))||todayStr(),notes});
        n++;
      }
      toast('Imported '+n+' leads'+(skipped?' · '+skipped+' duplicates skipped':''));render();
    }catch(err){toast('Import failed — check the file');}
    e.target.value='';
  };
  reader.readAsText(file);
});
function parseCsv(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}
      else cur+=c;
    }else if(c==='"')inQ=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';
      if(row.length>1||row[0]!=='')rows.push(row);
      row=[];
    }else cur+=c;
  }
  row.push(cur);
  if(row.length>1||row[0]!=='')rows.push(row);
  return rows;
}

/* ================= misc ================= */
function copyText(text,msg){
  const done=()=>toast(msg||'Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('Copy failed — long-press to copy manually');}
  document.body.removeChild(ta);
}
let toastTimer=null;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
$('#copyLinkBtn').onclick=()=>copyText(state.settings.link,'Your app link is copied — go close');
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  state.view=b.dataset.view;render();
});

render();
